[package]
name = "tar-dedup-lib"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
authors.workspace = true
description = "Deduplicating tar wrapper library for efficient cold storage of unstructured data"

[features]
# Debug-only: make DB dumps human-readable, but panic on any non-UTF-8 xattr value.
# Intentionally NOT part of `test-all`.
debug-force-utf8 = []
# Debug-only: turn `?` pass-through `.to_panic()` into an abort, so an unexpected
# error surfaces as a backtrace. Intentionally NOT part of `test-all`.
debug-err-to-panic = []
# Debug-only: compile the `--ordering id` override (plain `files(id)` order).
# Intentionally NOT part of `test-all`.
debug-ordering = []
# Debug-only: sleep before every progress-bar increment (env TAR_DEDUP_SLOW_PROGRESS_MS, default 100).
# Intentionally NOT part of `test-all` (would make the suite crawl).
debug-slow-progress = []
# Heavy compression round-trip test suite (all formats × all levels).
test-compression = []
# xattr / POSIX ACL / SELinux round-trip suite. Requires a filesystem that
# supports all three; enabled tests fail loudly on a filesystem lacking support.
test-extended-attributes = []
# Meta feature aggregating the on-demand test suites.
test-all = ["test-compression", "test-extended-attributes"]

[dependencies]
clap = { workspace = true }
clap_complete = { workspace = true }
tar = { workspace = true }
xz2 = { workspace = true }
lzma-sys = { workspace = true }
flate2 = { workspace = true }
bzip2 = { workspace = true }
zstd = { workspace = true, features = ["zstdmt"] }
rusqlite = { workspace = true }
sha1 = { workspace = true }
base64 = { workspace = true }
walkdir = { workspace = true }
nix = { workspace = true }
fs4 = { workspace = true }
rayon = { workspace = true }
crossbeam-channel = { workspace = true }
signal-hook = { workspace = true }
num_cpus = { workspace = true }
indicatif = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde = { workspace = true }
chrono = { workspace = true }
filetime = { workspace = true }
file-mode = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
path-clean = "1.0.1"
posix-acl = "1.2.0"
xattrs = "0.1.0"
selinux = "0.6.3"
serde_json = "1.0.150"
sparse-cp = { workspace = true }
regex = "1.13.1"
reflink = "0.1.3"
dedent = "0.1.1"

[dev-dependencies]
tempfile = { workspace = true }
